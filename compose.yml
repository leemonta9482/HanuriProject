# 한 도메인으로 전체(프론트 + 백엔드 + MySQL)를 띄운다.
#   cp .env.example .env  →  값 채우기  →  docker compose up --build -d
# 밖으로 여는 포트는 127.0.0.1:${PORT} 하나(nginx). 나머지는 컨테이너 네트워크 안에서만 통한다.
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 넣어주세요}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - db-data:/var/lib/mysql
      # 첫 기동에 스키마 생성 (main.sql 이 CREATE DATABASE 까지 한다). 이미 데이터가 있으면 실행되지 않는다.
      - ./database/main.sql:/docker-entrypoint-initdb.d/01-main.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: root
      DB_NAME: HanuriProject
      TZ: Asia/Seoul
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/paddlex:/root/.paddlex
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db-data:
